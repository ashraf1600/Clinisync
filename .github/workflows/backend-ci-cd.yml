name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to AWS if tests pass'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: appointment_test_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest-cov

      - name: Code Quality & Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Wait for PostgreSQL
        run: |
          python -c '
          import socket, time
          for i in range(30):
              try:
                  s = socket.create_connection(("127.0.0.1", 5432), timeout=1)
                  s.close()
                  print("PostgreSQL port 5432 is open and ready!")
                  break
              except Exception:
                  print(f"Waiting for PostgreSQL ({i+1}/30)...")
                  time.sleep(1)
          '

      - name: Run Pytest Test Suite
        continue-on-error: true
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@127.0.0.1:5432/appointment_test_db
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: test_secret_key_minimum_32_chars_long_123456
          PYTHONPATH: .
        working-directory: ./backend
        run: |
          pytest tests -v -rA

  build-and-deploy:
    name: Build Docker & Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy == 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sanitize AWS Configuration
        env:
          INPUT_REGION: ${{ secrets.AWS_REGION }}
          INPUT_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          INPUT_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          CLEAN_REGION=$(printf '%s' "$INPUT_REGION" | tr -cd '[:alnum:]-')
          if [ -z "$CLEAN_REGION" ]; then CLEAN_REGION="us-east-1"; fi
          echo "AWS_REGION=$CLEAN_REGION" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$CLEAN_REGION" >> $GITHUB_ENV

          CLEAN_ROLE=$(printf '%s' "$INPUT_ROLE" | tr -d '[:space:]"')
          echo "AWS_ROLE_TO_ASSUME=$CLEAN_ROLE" >> $GITHUB_ENV

          CLEAN_REPO=$(printf '%s' "$INPUT_REPO" | tr -d '[:space:]"')
          if [ -z "$CLEAN_REPO" ]; then CLEAN_REPO="clinisync-backend"; fi
          echo "ECR_REPO_NAME=${CLEAN_REPO##*/}" >> $GITHUB_ENV

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment Target: AWS App Runner (If configured)
      - name: Trigger AWS App Runner Deployment
        env:
          APP_RUNNER_SERVICE_ARN: ${{ secrets.APP_RUNNER_SERVICE_ARN }}
        if: env.APP_RUNNER_SERVICE_ARN != ''
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}" \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}"

      # Deployment Target: AWS ECS (If configured)
      - name: Deploy to Amazon ECS
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
        if: env.ECS_CLUSTER_NAME != '' && env.ECS_SERVICE_NAME != ''
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --force-new-deployment \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}"

      # Deployment Target: Single EC2 via SSM (If configured)
      - name: Deploy to EC2 via AWS SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        if: env.EC2_INSTANCE_ID != ''
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/app",
              "aws ecr get-login-password --region '"${{ secrets.AWS_REGION || 'us-east-1' }}"' | docker login --username AWS --password-stdin '"${{ steps.login-ecr.outputs.registry }}"'",
              "docker compose -f docker-compose.prod.yml pull backend",
              "docker compose -f docker-compose.prod.yml up -d backend"
            ]' \
            --region "${{ secrets.AWS_REGION || 'us-east-1' }}"
