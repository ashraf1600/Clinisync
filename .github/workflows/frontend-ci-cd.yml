name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type-Check & Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://clinisync-api.onrender.com/api/v1' }}
        run: npm run build

      - name: Sanitize AWS Configuration
        if: github.ref == 'refs/heads/main'
        env:
          INPUT_REGION: ${{ secrets.AWS_REGION }}
          INPUT_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
          INPUT_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          INPUT_CF: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          CLEAN_REGION=$(printf '%s' "$INPUT_REGION" | tr -cd '[:alnum:]-')
          if [ -z "$CLEAN_REGION" ]; then CLEAN_REGION="us-east-1"; fi
          echo "AWS_REGION=$CLEAN_REGION" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$CLEAN_REGION" >> $GITHUB_ENV

          CLEAN_BUCKET=$(printf '%s' "$INPUT_BUCKET" | tr -d '[:space:]"' | sed 's|^s3://||')
          echo "FRONTEND_S3_BUCKET=$CLEAN_BUCKET" >> $GITHUB_ENV

          CLEAN_ROLE=$(printf '%s' "$INPUT_ROLE" | tr -d '[:space:]"')
          echo "AWS_ROLE_TO_ASSUME=$CLEAN_ROLE" >> $GITHUB_ENV

          CLEAN_CF=$(printf '%s' "$INPUT_CF" | tr -d '[:space:]"')
          echo "CLOUDFRONT_DISTRIBUTION_ID=$CLEAN_CF" >> $GITHUB_ENV

      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Built Assets to Amazon S3
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying frontend to s3://${FRONTEND_S3_BUCKET} (Region: ${AWS_REGION})..."
          aws s3 sync frontend/dist s3://${FRONTEND_S3_BUCKET} \
            --region "${AWS_REGION}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${FRONTEND_S3_BUCKET}/index.html \
            --region "${AWS_REGION}" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
