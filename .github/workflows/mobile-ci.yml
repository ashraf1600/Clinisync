name: Mobile CI/CD (Flutter)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Flutter Lint, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No unit tests found in mobile/test yet, skipping."
          fi

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons || flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinisync-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
