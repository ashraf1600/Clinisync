name: Mobile CI/CD (Flutter)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Flutter Lint, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Initialize Android Platform Files
        working-directory: ./mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.clinisync .
          fi

      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./mobile
        run: flutter analyze || true

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No unit tests found in mobile/test yet, skipping."
          fi

      - name: Build Android Release APK
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons || flutter build apk --release || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: clinisync-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 14

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Initialize Windows Platform Files
        working-directory: ./mobile
        run: |
          if (-not (Test-Path "windows")) { flutter create --platforms=windows --org com.clinisync . }
        shell: pwsh
      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get
      - name: Build Windows Release EXE
        working-directory: ./mobile
        run: flutter build windows --release
      - name: Zip Windows Build
        run: Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath clinisync-windows-exe.zip
        shell: pwsh
      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinisync-windows-exe
          path: clinisync-windows-exe.zip
          if-no-files-found: warn
          retention-days: 14
