services:
  - type: web
    name: clinisync-api
    runtime: docker
    dockerfilePath: backend/Dockerfile.prod
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clinisync-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://d15yucoed6jmf7.cloudfront.net","http://localhost:5173"]'
      - key: CRON_SECRET_KEY
        generateValue: true

databases:
  - name: clinisync-db
    databaseName: appointment_db
    user: clinisync_user
    plan: free
    region: oregon
